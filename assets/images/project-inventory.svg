<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Inventory Management System cover illustration">
  <defs>
    <linearGradient id="inv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="inv-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35D4AE"/>
      <stop offset="1" stop-color="#8B6CFF"/>
    </linearGradient>
    <linearGradient id="inv-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8B6CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B6CFF"/>
    </linearGradient>
    <linearGradient id="inv-bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#35D4AE" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#35D4AE"/>
    </linearGradient>
    <linearGradient id="inv-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171F30"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <clipPath id="inv-window">
      <rect x="436" y="44" width="300" height="232" rx="16"/>
    </clipPath>
  </defs>

  <rect width="800" height="320" fill="url(#inv-bg)"/>
  <circle cx="110" cy="20" r="160" fill="#35D4AE" opacity="0.13"/>
  <circle cx="730" cy="310" r="190" fill="#8B6CFF" opacity="0.13"/>
  <circle cx="800" cy="30" r="110" fill="#35D4AE" opacity="0.08"/>

  <!-- Left: brand copy -->
  <text x="64" y="108" font-family="'IBM Plex Mono', Consolas, monospace" font-size="11" letter-spacing="2.4" fill="#35D4AE">ASP.NET CORE MVC</text>
  <text x="62" y="158" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="31" font-weight="800" letter-spacing="-0.6" fill="#E7E9F3">Inventory System</text>
  <text x="64" y="186" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" fill="#96A0BC">Products, purchases, sales &amp; live stock levels.</text>

  <rect x="64" y="208" width="104" height="28" rx="14" fill="rgba(53,212,174,0.10)" stroke="rgba(53,212,174,0.4)"/>
  <text x="82" y="226" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#7FE7CE">EF Core</text>

  <rect x="178" y="208" width="118" height="28" rx="14" fill="rgba(139,108,255,0.12)" stroke="rgba(139,108,255,0.45)"/>
  <text x="196" y="226" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#C9BBFF">SQL Server</text>

  <rect x="306" y="208" width="96" height="28" rx="14" fill="rgba(255,255,255,0.03)" stroke="#2A3450"/>
  <text x="324" y="226" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#B7BFD6">Reports</text>

  <!-- Right: dashboard mock -->
  <rect x="436" y="44" width="300" height="232" rx="16" fill="url(#inv-card)" stroke="#2A3450"/>
  <g clip-path="url(#inv-window)">
    <rect x="436" y="44" width="300" height="34" fill="#0F1420"/>
    <circle cx="454" cy="61" r="3.5" fill="#FF6B6B" opacity="0.85"/>
    <circle cx="466" cy="61" r="3.5" fill="#F2B84B" opacity="0.85"/>
    <circle cx="478" cy="61" r="3.5" fill="#35D4AE" opacity="0.85"/>
    <rect x="500" y="53" width="150" height="16" rx="8" fill="#171F30"/>
    <text x="510" y="65" font-family="'IBM Plex Mono', Consolas, monospace" font-size="9" fill="#6E7896">inventory / dashboard</text>

    <!-- Header -->
    <text x="454" y="100" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#E7E9F3">Overview</text>
    <rect x="660" y="90" width="58" height="14" rx="7" fill="#171F30" stroke="#2A3450"/>
    <rect x="670" y="95" width="38" height="4" rx="2" fill="#4A5678"/>

    <!-- KPI cards -->
    <rect x="454" y="112" width="88" height="50" rx="9" fill="#171F30" stroke="#2A3450"/>
    <text x="464" y="130" font-family="'IBM Plex Mono', Consolas, monospace" font-size="7.5" fill="#96A0BC">INVENTORY</text>
    <text x="464" y="150" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#E7E9F3">$48.2k</text>

    <rect x="550" y="112" width="88" height="50" rx="9" fill="#171F30" stroke="#2A3450"/>
    <text x="560" y="130" font-family="'IBM Plex Mono', Consolas, monospace" font-size="7.5" fill="#96A0BC">SALES TODAY</text>
    <text x="560" y="150" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#35D4AE">$1.8k</text>

    <rect x="646" y="112" width="72" height="50" rx="9" fill="#171F30" stroke="#2A3450"/>
    <text x="656" y="130" font-family="'IBM Plex Mono', Consolas, monospace" font-size="7.5" fill="#96A0BC">LOW STOCK</text>
    <text x="656" y="150" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#F2B84B">04</text>

    <!-- Chart -->
    <rect x="454" y="176" width="180" height="86" rx="9" fill="#171F30" stroke="#2A3450"/>
    <text x="464" y="192" font-family="'IBM Plex Mono', Consolas, monospace" font-size="7.5" fill="#96A0BC">SALES TREND</text>
    <line x1="464" y1="248" x2="620" y2="248" stroke="#2A3450"/>
    <rect x="468" y="222" width="18" height="26" rx="3" fill="url(#inv-bar)"/>
    <rect x="494" y="210" width="18" height="38" rx="3" fill="url(#inv-bar)"/>
    <rect x="520" y="228" width="18" height="20" rx="3" fill="url(#inv-bar2)"/>
    <rect x="546" y="202" width="18" height="46" rx="3" fill="url(#inv-bar)"/>
    <rect x="572" y="216" width="18" height="32" rx="3" fill="url(#inv-bar2)"/>
    <rect x="598" y="196" width="18" height="52" rx="3" fill="url(#inv-bar)"/>

    <!-- Low stock list -->
    <rect x="644" y="176" width="78" height="86" rx="9" fill="#171F30" stroke="#2A3450"/>
    <text x="654" y="192" font-family="'IBM Plex Mono', Consolas, monospace" font-size="7.5" fill="#96A0BC">ALERTS</text>
    <circle cx="656" cy="206" r="4" fill="#F2B84B"/>
    <rect x="666" y="203" width="44" height="4" rx="2" fill="#4A5678"/>
    <circle cx="656" cy="224" r="4" fill="#FF6B6B" opacity="0.8"/>
    <rect x="666" y="221" width="34" height="4" rx="2" fill="#4A5678"/>
    <circle cx="656" cy="242" r="4" fill="#35D4AE"/>
    <rect x="666" y="239" width="40" height="4" rx="2" fill="#4A5678"/>
  </g>

  <path d="M436 260 L436 44" stroke="url(#inv-accent)" stroke-width="2" opacity="0.7"/>
</svg>
