<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Student Platform cover illustration">
  <defs>
    <linearGradient id="sp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="sp-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="1" stop-color="#35D4AE"/>
    </linearGradient>
    <linearGradient id="sp-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171F30"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <clipPath id="sp-window">
      <rect x="436" y="44" width="300" height="232" rx="16"/>
    </clipPath>
  </defs>

  <rect width="800" height="320" fill="url(#sp-bg)"/>
  <circle cx="120" cy="20" r="160" fill="#8B6CFF" opacity="0.16"/>
  <circle cx="720" cy="310" r="180" fill="#35D4AE" opacity="0.10"/>
  <circle cx="800" cy="40" r="120" fill="#8B6CFF" opacity="0.10"/>

  <!-- Left: brand copy -->
  <text x="64" y="108" font-family="'IBM Plex Mono', Consolas, monospace" font-size="11" letter-spacing="2.4" fill="#35D4AE">ASP.NET CORE MVC</text>
  <text x="62" y="158" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="31" font-weight="800" letter-spacing="-0.6" fill="#E7E9F3">Student Platform</text>
  <text x="64" y="186" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" fill="#96A0BC">Lectures, assignments &amp; student submissions.</text>

  <rect x="64" y="208" width="104" height="28" rx="14" fill="rgba(139,108,255,0.12)" stroke="rgba(139,108,255,0.45)"/>
  <text x="82" y="226" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#C9BBFF">Role-based</text>

  <rect x="178" y="208" width="96" height="28" rx="14" fill="rgba(53,212,174,0.10)" stroke="rgba(53,212,174,0.4)"/>
  <text x="196" y="226" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#7FE7CE">Identity</text>

  <rect x="284" y="208" width="96" height="28" rx="14" fill="rgba(255,255,255,0.03)" stroke="#2A3450"/>
  <text x="302" y="226" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#B7BFD6">EF Core</text>

  <!-- Right: app window mock -->
  <rect x="436" y="44" width="300" height="232" rx="16" fill="url(#sp-card)" stroke="#2A3450"/>
  <g clip-path="url(#sp-window)">
    <rect x="436" y="44" width="300" height="34" fill="#0F1420"/>
    <circle cx="454" cy="61" r="3.5" fill="#FF6B6B" opacity="0.85"/>
    <circle cx="466" cy="61" r="3.5" fill="#F2B84B" opacity="0.85"/>
    <circle cx="478" cy="61" r="3.5" fill="#35D4AE" opacity="0.85"/>
    <rect x="500" y="53" width="150" height="16" rx="8" fill="#171F30"/>
    <text x="510" y="65" font-family="'IBM Plex Mono', Consolas, monospace" font-size="9" fill="#6E7896">studentplatform</text>

    <!-- Sidebar -->
    <rect x="436" y="78" width="88" height="198" fill="#0D121D"/>
    <rect x="448" y="92" width="64" height="18" rx="9" fill="url(#sp-accent)" opacity="0.9"/>
    <rect x="456" y="99" width="48" height="4" rx="2" fill="#0B0E14" opacity="0.65"/>
    <rect x="448" y="122" width="58" height="5" rx="2.5" fill="#39445F"/>
    <rect x="448" y="140" width="48" height="5" rx="2.5" fill="#39445F"/>
    <rect x="448" y="158" width="54" height="5" rx="2.5" fill="#39445F"/>
    <rect x="448" y="176" width="42" height="5" rx="2.5" fill="#39445F"/>
    <circle cx="454" cy="236" r="9" fill="#8B6CFF" opacity="0.5"/>
    <rect x="468" y="231" width="40" height="4" rx="2" fill="#39445F"/>
    <rect x="468" y="239" width="26" height="4" rx="2" fill="#2A3450"/>

    <!-- Main header -->
    <text x="542" y="102" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#E7E9F3">Teacher Dashboard</text>
    <rect x="542" y="110" width="90" height="4" rx="2" fill="#2A3450"/>

    <!-- Stat cards -->
    <rect x="542" y="128" width="86" height="48" rx="9" fill="#171F30" stroke="#2A3450"/>
    <text x="552" y="146" font-family="'IBM Plex Mono', Consolas, monospace" font-size="8" fill="#96A0BC">LECTURES</text>
    <text x="552" y="165" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#E7E9F3">12</text>

    <rect x="638" y="128" width="86" height="48" rx="9" fill="#171F30" stroke="#2A3450"/>
    <text x="648" y="146" font-family="'IBM Plex Mono', Consolas, monospace" font-size="8" fill="#96A0BC">TASKS</text>
    <text x="648" y="165" font-family="'Manrope', 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#35D4AE">28</text>

    <!-- Assignment list -->
    <rect x="542" y="188" width="182" height="28" rx="8" fill="#171F30" stroke="#2A3450"/>
    <circle cx="556" cy="202" r="6" fill="#35D4AE" opacity="0.85"/>
    <rect x="570" y="197" width="86" height="4" rx="2" fill="#4A5678"/>
    <rect x="570" y="205" width="54" height="3.5" rx="1.75" fill="#2A3450"/>
    <rect x="694" y="197" width="18" height="10" rx="5" fill="rgba(53,212,174,0.16)"/>

    <rect x="542" y="224" width="182" height="28" rx="8" fill="#171F30" stroke="#2A3450"/>
    <circle cx="556" cy="238" r="6" fill="#8B6CFF" opacity="0.85"/>
    <rect x="570" y="233" width="70" height="4" rx="2" fill="#4A5678"/>
    <rect x="570" y="241" width="46" height="3.5" rx="1.75" fill="#2A3450"/>
    <rect x="694" y="233" width="18" height="10" rx="5" fill="rgba(139,108,255,0.18)"/>
  </g>

  <!-- Accent corner glow line -->
  <path d="M436 260 L436 44" stroke="url(#sp-accent)" stroke-width="2" opacity="0.7"/>
</svg>
